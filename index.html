    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF9F6;

        }

        h1,
        h2,
        h3,
        .serif {

        }

        @keyframes custom-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-slow-spin {
            animation: custom-spin 20s linear infinite;
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slide-in-right {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .reveal {
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .reveal-delay-1 {
            animation-delay: 0.1s;
            opacity: 0;
        }

        .reveal-delay-2 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        .reveal-delay-3 {
            animation-delay: 0.3s;
            opacity: 0;
        }

        /* Animación de pulso pronunciada y elástica */
        @keyframes heart-pulse {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.6);
            }

            50% {
                transform: scale(0.85);
            }

            70% {
                transform: scale(1.15);
            }

            90% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-heart-pulse {
            animation: heart-pulse 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Trayectoria de vuelo elástica y parabólica */
        @keyframes fly-to-cart {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                border-radius: 4px;
            }

            20% {
                transform: scale(1.15) rotate(-10deg);
                opacity: 1;
            }

            100% {
                top: 20px;
                left: calc(100% - 60px);
                width: 24px;
                height: 24px;
                transform: scale(0.1) rotate(45deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        /* Rebote de impacto en el carrito */
        @keyframes cart-impact {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.5) rotate(-10deg);
            }

            50% {
                transform: scale(0.8) rotate(5deg);
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-cart-impact {
            animation: cart-impact 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes petal-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            animation: petal-fall linear forwards;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
